    <link rel="icon" type="image/svg+xml" href="./dist/favicon.svg" />
    <script>
      // Resolve before the first paint; keep in sync with src/app/theme.ts.
      (function () {
        var preference = 'system';
        try {
          preference = localStorage.getItem('circuit-lab.theme') || 'system';
        } catch (_) {}
        var theme =
          preference === 'light' || preference === 'dark'
            ? preference
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <meta name="theme-color" content="#0e7665" />
